<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH Studio — Reportes de Proyecto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Archivo:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --kraft:#E9E5DA;
    --ink:#181613;
    --olive:#5F5C43;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--kraft);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vw;
  }
  .wrap{max-width:640px;text-align:center;}
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(2.5rem, 6vw, 4rem);
    margin:0 0 0.5rem;
    letter-spacing:0.01em;
  }
  .sub{
    font-family:'Archivo', sans-serif;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:0.85rem;
    color:var(--olive);
    margin-bottom:2.5rem;
  }
  p{font-size:0.95rem; line-height:1.6; opacity:0.85;}
  .foot{margin-top:3rem; font-size:0.75rem; opacity:0.6;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sub">TH Studio · Reportes de Proyecto</div>
    <h1>Este espacio se está construyendo</h1>
    <p>Aquí llegarán las actualizaciones semanales de obra para cada proyecto — el mismo formato editorial que ya conoces, ahora con un link fijo y permanente.</p>
    <div class="foot">TH Creative &amp; Interior Design Studio</div>
  </div>
</body>
</html>
